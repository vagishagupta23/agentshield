[project]
name = "agentshield"
version = "0.1.0"
description = "An AI agent, an automated attack and evaluation suite against it, and a data-flow security layer to defend it"
readme = "README.md"
authors = [
    { name = "Vagisha Gupta", email = "vagishagupta23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agentshield = "agentshield:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
